name: build-fix-image

# 仅用于在 fork 中构建带修复的体验镜像，不会进入 PR
on:
  workflow_dispatch:
  push:
    branches:
      - build-fix-image

jobs:
  build-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: dongshull/Docker-Copilot-React
          path: frontend
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: false

      - name: Build backend binary
        run: |
          mkdir -p front
          cp -r frontend/dist/. front/
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -a --trimpath -ldflags="-w -s -X 'github.com/onlyLTY/dockerCopilot/internal/config.Version=fix-test'" \
            -o dockerCopilot .
          mkdir -p dc-back/dist/linux/${{ matrix.arch }}
          cp dockerCopilot dc-back/dist/linux/${{ matrix.arch }}/
          cp -r etc dc-back/etc
          ls -l dc-back/dist/linux/${{ matrix.arch }}/dockerCopilot

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image tar
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --tag dockercopilot:fix-test \
            --output type=docker,dest=dockercopilot-fix-${{ matrix.arch }}.tar \
            -f docker/Dockerfile .
          gzip -f dockercopilot-fix-${{ matrix.arch }}.tar
          ls -lh dockercopilot-fix-${{ matrix.arch }}.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockercopilot-fix-${{ matrix.arch }}
          path: dockercopilot-fix-${{ matrix.arch }}.tar.gz
          retention-days: 7
